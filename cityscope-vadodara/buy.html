<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Buy Property — Cityscope Vadodara</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="icon-btn" id="backBtn"></button>
    <div class="brand">
      <div class="brand-name">CITYSCOPE</div>
      <div class="brand-sub">VADODARA</div>
    </div>
    <button class="icon-btn" id="filterBtn"></button>
  </div>

  <div class="page-title-bar">
    <h1 id="pageTitle">Properties for Sale</h1>
    <p id="resultCount"></p>
  </div>

  <div class="tabs" id="saleRentTabs" style="margin:0 18px 4px;border-radius:12px;overflow:hidden;border:1.5px solid var(--gray-200);">
    <button data-type="Sale" class="active">Buy</button>
    <button data-type="Rent">Rent</button>
  </div>

  <div class="search-fields" style="padding:4px 18px 10px;">
    <div class="field" style="border:1.5px solid var(--gray-200);border-radius:12px;padding:10px 14px;">
      <span class="ic"></span>
      <div class="meta">
        <label>Location</label>
        <select id="fLocation"><option value="">All areas</option></select>
      </div>
      <span class="chev"></span>
    </div>
  </div>

  <div class="prop-list" id="listWrap"></div>

  <div class="map-wrap" id="mapWrap">
    <div id="propMap"></div>
    <button class="map-search-area" id="searchAreaBtn"></button>
    <div class="map-controls">
      <button class="locate-btn" id="locateBtn" aria-label="My location"></button>
      <button id="zoomInBtn" aria-label="Zoom in">+</button>
      <button id="zoomOutBtn" aria-label="Zoom out">−</button>
    </div>
    <a class="map-preview" id="mapPreview" href="#">
      <button class="close-preview" id="closePreview" type="button">✕</button>
      <img id="mpImg" src="" alt="">
      <div class="body">
        <h4 id="mpTitle"></h4>
        <div class="loc" id="mpLoc"></div>
        <div class="price" id="mpPrice"></div>
      </div>
    </a>
  </div>

  <button class="view-toggle" id="viewToggleBtn"></button>

  <nav class="bottom-nav" id="bottom-nav"></nav>
</div>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/nav.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
  mountBottomNav("buy");
  document.getElementById("backBtn").innerHTML = ICON.back;
  document.getElementById("backBtn").onclick = ()=> window.location.href="index.html";
  document.getElementById("filterBtn").innerHTML = ICON.search;
  document.querySelector(".field .ic").innerHTML = ICON.pin;
  document.querySelector(".field .chev").innerHTML = ICON.chevDown;

  const locs = [...new Set(DB.all().map(p=>p.locality))];
  document.getElementById("fLocation").innerHTML += locs.map(l=>`<option>${l}</option>`).join("");

  const qs = new URLSearchParams(window.location.search);
  if(qs.get("loc")) document.getElementById("fLocation").value = qs.get("loc");

  let currentType = qs.get("type") === "Rent" ? "Rent" : "Sale";

  function setTypeUI(){
    document.querySelectorAll("#saleRentTabs button").forEach(b=>{
      b.classList.toggle("active", b.dataset.type === currentType);
    });
    document.getElementById("pageTitle").textContent = currentType === "Rent" ? "Properties for Rent" : "Properties for Sale";
    document.title = (currentType === "Rent" ? "Rent Property" : "Buy Property") + " — Cityscope Vadodara";
  }

  document.getElementById("saleRentTabs").addEventListener("click", (e)=>{
    const btn = e.target.closest("button");
    if(!btn) return;
    currentType = btn.dataset.type;
    setTypeUI();
    applyFilters();
    mapPreview.classList.remove("show");
    if (mapReady) { renderMarkers(); if (isMapView) fitToMarkers(); }
  });

  function applyFilters(){
    let list = DB.all().filter(p=>p.forType===currentType);
    const loc = document.getElementById("fLocation").value;
    if(loc) list = list.filter(p=>p.locality===loc);
    const ptype = qs.get("ptype");
    if(ptype) list = list.filter(p=>p.type===ptype);
    const budget = qs.get("budget");
    if(budget){
      const [min,max] = budget.split("-").map(Number);
      list = list.filter(p=>p.price>=min && p.price<=max);
    }
    document.getElementById("resultCount").textContent = `${list.length} propert${list.length===1?'y':'ies'} found`;
    document.getElementById("listWrap").innerHTML = list.length ? list.map(p=>propCardHTML(p,true)).join("") : `
      <div class="empty">
        <div class="ic-wrap">${ICON.search}</div>
        <h3>No properties found</h3>
        <p>Try adjusting your filters or explore all listings.</p>
      </div>`;
    wireFavButtons();
  }
  document.getElementById("fLocation").addEventListener("change", applyFilters);
  setTypeUI();
  applyFilters();

  // ===== Map view =====
  const listWrap = document.getElementById("listWrap");
  const mapWrap = document.getElementById("mapWrap");
  const toggleBtn = document.getElementById("viewToggleBtn");
  const searchAreaBtn = document.getElementById("searchAreaBtn");
  const mapPreview = document.getElementById("mapPreview");
  let map, markers = [], mapReady = false, isMapView = false, lastFetchedBounds = null;

  function currentListForMap(){
    let list = DB.all().filter(p => p.forType === currentType && p.lat && p.lng);
    const loc = document.getElementById("fLocation").value;
    if (loc) list = list.filter(p => p.locality === loc);
    return list;
  }

  function priceIcon(p, active){
    return L.divIcon({
      className: "",
      html: `<div class="map-pin${active ? " active" : ""}">${p.priceLabel}</div>`,
      iconSize: null,
      iconAnchor: [30, 34]
    });
  }

  function showPreview(p){
    document.querySelectorAll(".map-pin.active").forEach(el => el.classList.remove("active"));
    const idx = markers.findIndex(m => m.propId === p.id);
    if (idx > -1) markers[idx].marker.getElement()?.querySelector(".map-pin")?.classList.add("active");
    document.getElementById("mpImg").src = p.images[0];
    document.getElementById("mpTitle").textContent = p.title;
    document.getElementById("mpLoc").innerHTML = `${ICON.pin}<span>${p.locality}, ${p.city}</span>`;
    document.getElementById("mpPrice").innerHTML = `${p.priceLabel}<span style="font-size:11px;font-weight:600;color:var(--gray-600);"> ${p.priceUnit}</span>`;
    mapPreview.href = `property.html?id=${p.id}`;
    mapPreview.classList.add("show");
  }

  function fitToMarkers(){
    const list = currentListForMap();
    if (list.length) {
      const bounds = L.latLngBounds(list.map(p => [p.lat, p.lng]));
      map.fitBounds(bounds, { padding: [40, 40] });
      lastFetchedBounds = map.getBounds();
      searchAreaBtn.classList.remove("show");
    }
  }

  function renderMarkers(){
    if (map) markers.forEach(m => map.removeLayer(m.marker));
    markers = [];
    const list = currentListForMap();
    list.forEach(p => {
      const marker = L.marker([p.lat, p.lng], { icon: priceIcon(p, false), bubblingMouseEvents: false }).addTo(map);
      marker.on("click", (e) => {
        L.DomEvent.stopPropagation(e);
        showPreview(p);
      });
      markers.push({ propId: p.id, marker });
    });
    return list;
  }

  function initMap(){
    if (mapReady) {
      renderMarkers();
      fitToMarkers();
      return;
    }
    map = L.map("propMap", { zoomControl: false, attributionControl: true }).setView([22.3072, 73.1812], 12);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "© OpenStreetMap contributors"
    }).addTo(map);

    renderMarkers();
    fitToMarkers();

    map.on("dragend zoomend", () => {
      if (!lastFetchedBounds || !map.getBounds().equals(lastFetchedBounds)) {
        searchAreaBtn.classList.add("show");
      }
    });
    map.on("click", () => mapPreview.classList.remove("show"));

    mapReady = true;
  }

  searchAreaBtn.innerHTML = `${ICON.search} Search this area`;
  searchAreaBtn.addEventListener("click", () => {
    renderMarkers();
    lastFetchedBounds = map.getBounds();
    searchAreaBtn.classList.remove("show");
  });

  document.getElementById("closePreview").addEventListener("click", (e) => {
    e.preventDefault(); e.stopPropagation();
    mapPreview.classList.remove("show");
  });

  document.getElementById("zoomInBtn").addEventListener("click", () => map && map.zoomIn());
  document.getElementById("zoomOutBtn").addEventListener("click", () => map && map.zoomOut());
  document.getElementById("locateBtn").innerHTML = ICON.gps;
  document.getElementById("locateBtn").addEventListener("click", () => {
    if (!map) return;
    map.locate({ setView: true, maxZoom: 15 });
  });

  function setToggleLabel(){
    toggleBtn.innerHTML = isMapView
      ? `${ICON.listing} List View`
      : `${ICON.map} Map`;
  }

  toggleBtn.addEventListener("click", () => {
    isMapView = !isMapView;
    listWrap.classList.toggle("hidden", isMapView);
    mapWrap.classList.toggle("active", isMapView);
    setToggleLabel();
    if (isMapView) {
      initMap();
      requestAnimationFrame(() => map.invalidateSize());
    }
  });
  setToggleLabel();
</script>
</body>
</html>
